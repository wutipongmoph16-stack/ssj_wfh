<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบลงเวลางาน WFH</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
      body {
        font-family: "Kanit", sans-serif;
        background-color: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }
      .main-card {
        width: 100%;
        max-width: 480px;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        display: none; /* ซ่อนไว้รอเช็คสถานะ */
      }
      .profile-img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        margin-top: -40px;
        background-color: #fff;
      }
      #video {
        width: 100%;
        border-radius: 15px;
        background: #000;
        transform: scaleX(-1); /* Mirror Mode */
      }
      .btn-custom {
        padding: 12px;
        border-radius: 12px;
        font-weight: 500;
        transition: 0.3s;
      }
      #loader-container {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loader-container">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">กำลังเชื่อมต่อระบบ...</p>
    </div>

    <div id="step-profile" class="card main-card">
      <div class="card-body text-center pt-0">
        <img id="lineImg" class="profile-img mb-3" src="" />
        <h4 id="lineName" class="fw-bold">ยินดีต้อนรับ</h4>
        <p class="text-muted small">กรุณาลงทะเบียนข้อมูลพนักงานครั้งแรก</p>

        <div class="text-start">
          <label class="form-label small">ชื่อ-นามสกุลจริง</label>
          <input
            type="text"
            id="regName"
            class="form-control mb-2"
            placeholder="ระบุชื่อ-นามสกุล"
          />

          <label class="form-label small">เลขบัตรประชาชน</label>
          <input
            type="number"
            id="regId"
            class="form-control mb-2"
            placeholder="13 หลัก"
          />

          <div class="row g-2">
            <div class="col-6">
              <label class="form-label small">แผนก/กลุ่มงาน</label>
              <select id="regDept" class="form-select mb-2"></select>
            </div>
            <div class="col-6">
              <label class="form-label small">ตำแหน่ง</label>
              <select id="regJob" class="form-select mb-2"></select>
            </div>
          </div>

          <label class="form-label small">เบอร์โทรศัพท์หลัก</label>
          <input
            type="tel"
            id="regPhone1"
            class="form-control mb-3"
            placeholder="08x-xxxxxxx"
          />
        </div>

        <button
          class="btn btn-primary btn-custom w-100"
          onclick="saveProfile()"
        >
          บันทึกข้อมูลส่วนตัว
        </button>
      </div>
    </div>

    <div id="step-home" class="card main-card">
      <div class="card-body text-center p-4">
        <div class="display-4 mb-3">🏠</div>
        <h4 class="fw-bold">ลงทะเบียนจุดทำงาน</h4>
        <p class="text-muted small">
          กรุณากดปุ่มเพื่อบันทึกพิกัด "บ้าน" สำหรับตรวจสอบการเข้างาน
        </p>
        <button
          class="btn btn-primary btn-custom w-100 mt-3"
          onclick="saveHome()"
        >
          📍 บันทึกพิกัดปัจจุบัน
        </button>
      </div>
    </div>

    <div id="step-attendance" class="card main-card">
      <div class="card-body text-center p-4">
        <h5 id="userGreeting" class="fw-bold mb-3">สวัสดี</h5>
        <video id="video" autoplay playsinline class="mb-3"></video>
        <canvas id="canvas" style="display: none"></canvas>

        <div class="d-grid gap-2">
          <button
            class="btn btn-success btn-custom"
            onclick="handleAttendance('Check-In')"
          >
            บันทึกเข้างาน (Check-In)
          </button>
          <button
            class="btn btn-danger btn-custom"
            onclick="handleAttendance('Check-Out')"
          >
            บันทึกออกงาน (Check-Out)
          </button>
        </div>
        <div id="att-status" class="mt-3 small text-primary fw-bold"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      // ******************************************
      // คอนฟิกค่าที่นี่
      // ******************************************
      const WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbzf0koBIPCPwreI2PcjEexdZLCKlh7B8NDP3xnBXwa_X4n5pJnAwLp_I6aOjq49tmX1/exec";
      const LIFF_ID = "2009545857-BaQZhw9y";
      // ******************************************

      let uId = "",
        displayName = "",
        pictureUrl = "";

      async function callApi(payload) {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        const result = await response.json();
        if (result.status === "error") throw new Error(result.message);
        return result.data;
      }

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const profile = await liff.getProfile();
          uId = profile.userId;
          displayName = profile.displayName;
          pictureUrl = profile.pictureUrl;

          const status = await callApi({
            action: "CHECK_STATUS",
            lineUserId: uId,
          });
          document.getElementById("loader-container").style.display = "none";

          if (!status.registered || !status.hasProfile) {
            await loadDropdowns();
            showView("step-profile");
            document.getElementById("lineName").innerText = displayName;
            document.getElementById("lineImg").src =
              pictureUrl || "https://via.placeholder.com/80";
          } else if (!status.hasHome) {
            showView("step-home");
          } else {
            showView("step-attendance");
            document.getElementById("userGreeting").innerText =
              "สวัสดีคุณ " + status.fullName;
            startCamera();
          }
        } catch (err) {
          Swal.fire("Error", err.message, "error");
        }
      }

      function showView(id) {
        document
          .querySelectorAll(".main-card")
          .forEach((c) => (c.style.display = "none"));
        document.getElementById(id).style.display = "block";
      }

      async function loadDropdowns() {
        const data = await callApi({ action: "GET_DROPDOWN" });
        const dSel = document.getElementById("regDept");
        const jSel = document.getElementById("regJob");
        dSel.innerHTML = '<option value="">-- เลือกแผนก --</option>';
        jSel.innerHTML = '<option value="">-- เลือกตำแหน่ง --</option>';
        data.departments.forEach((d) => dSel.add(new Option(d, d)));
        data.jobTitles.forEach((j) => jSel.add(new Option(j, j)));
      }

      async function saveProfile() {
        const payload = {
          action: "REGISTER_PROFILE",
          lineUserId: uId,
          lineDisplayName: displayName,
          profilePicUrl: pictureUrl,
          fullName: document.getElementById("regName").value,
          idCard: document.getElementById("regId").value,
          jobTitle: document.getElementById("regJob").value,
          department: document.getElementById("regDept").value,
          phone1: document.getElementById("regPhone1").value,
        };

        if (
          !payload.fullName ||
          payload.idCard.length !== 13 ||
          !payload.department
        ) {
          Swal.fire(
            "ข้อมูลไม่ครบ",
            "กรุณากรอกข้อมูลให้ครบถ้วนและบัตรประชาชนต้องมี 13 หลัก",
            "warning",
          );
          return;
        }

        Swal.fire({
          title: "กำลังบันทึก...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const res = await callApi(payload);
          Swal.fire("สำเร็จ", res, "success").then(() => location.reload());
        } catch (e) {
          Swal.fire("Error", e.message, "error");
        }
      }

      async function saveHome() {
        Swal.fire({
          title: "กำลังดึงพิกัด GPS...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            try {
              const res = await callApi({
                action: "REGISTER_HOME",
                lineUserId: uId,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              });
              Swal.fire("สำเร็จ", res, "success").then(() => location.reload());
            } catch (e) {
              Swal.fire("Error", e.message, "error");
            }
          },
          (err) =>
            Swal.fire("GPS Error", "กรุณาเปิด GPS และอนุญาตสิทธิ์", "error"),
        );
      }

      function startCamera() {
        const video = document.getElementById("video");
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "user" } })
          .then((stream) => (video.srcObject = stream))
          .catch((err) =>
            Swal.fire("กล้อง Error", "ไม่สามารถเปิดกล้องได้", "error"),
          );
      }

      async function handleAttendance(type) {
        document.getElementById("att-status").innerText = "⌛ กำลังประมวลผล...";

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const canvas = document.getElementById("canvas");
            const video = document.getElementById("video");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);

            try {
              const res = await callApi({
                action: "ATTENDANCE",
                status: type,
                lineUserId: uId,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                image: canvas.toDataURL("image/jpeg", 0.6),
              });
              Swal.fire({
                title: "บันทึกสำเร็จ",
                text: res,
                icon: "success",
                timer: 3000,
              });
              document.getElementById("att-status").innerText = "✅ " + res;
            } catch (e) {
              Swal.fire("Error", e.message, "error");
              document.getElementById("att-status").innerText =
                "❌ เกิดข้อผิดพลาด";
            }
          },
          (err) =>
            Swal.fire("GPS Error", "โปรดอนุญาตสิทธิ์เข้าถึงพิกัด", "error"),
          { enableHighAccuracy: true },
        );
      }

      window.onload = init;
    </script>
  </body>
</html>
